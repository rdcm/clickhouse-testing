[workspace]
resolver = "2"
members = [
    "core",
    "macros",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
authors = ["rdcm@protonmail.ch"]
license = "MIT"
readme = "README.md"
keywords = ["clickhouse", "testing", "database"]
repository = "https://github.com/rdcm/clickhouse-testing"
rust-version = "1.99.0"
description = "A crate that simplifies writing integration tests for ClickHouse, inspired by sqlx."
categories = ["development-tools::testing", "database"]

[workspace.dependencies]
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "3.0.9", features = ["full"] }
quote = "1.0.47"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
clickhouse = "0.15.3"
clickhouse-testing = { path = "core" }
clickhouse-testing-macros = { path = "macros", version = "0.1.4" }
rstest = "0.27.0"
