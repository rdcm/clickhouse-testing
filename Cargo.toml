[workspace]
resolver = "2"
members = [
    "core",
    "macros",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
authors = ["rdcm@protonmail.ch"]
license = "MIT"
readme = "README.md"
keywords = ["clickhouse", "testing", "database"]
repository = "https://github.com/rdcm/clickhouse-testing"
rust-version = "1.92.0"
description = "A crate that simplifies writing integration tests for ClickHouse, inspired by sqlx."
categories = ["development-tools::testing", "database"]

[workspace.dependencies]
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "2.0.114", features = ["full"] }
quote = "1.0.44"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
clickhouse = "0.14.2"
clickhouse-testing = { path = "core" }
clickhouse-testing-macros = { path = "macros", version = "0.1.1" }
rstest = "0.26.1"
